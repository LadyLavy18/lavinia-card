<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lavinia — Scheda contatto</title>
<meta name="description" content="Scheda contatto di Lavinia — sviluppo prodotto calzature, Milano.">

<meta property="og:title" content="Lavinia — Scheda contatto">
<meta property="og:description" content="Sviluppo prodotto calzature — Milano">
<meta property="og:type" content="profile">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --stock:      #1b1917;   /* fondo: magazzino, cartone scuro */
  --paper:      #e9e2d4;   /* cartoncino manila del cartellino */
  --paper-edge: #d6cdba;
  --ink:        #26221d;   /* testo stampato */
  --ink-soft:   #6e6559;
  --rule:       #bcb099;
  --stamp:      #563d82;   /* inchiostro del timbro */
  --cord:       #9a8f7c;
}

*{box-sizing:border-box}

html,body{margin:0;padding:0}

body{
  min-height:100svh;
  background:var(--stock);
  color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:clamp(20px,6vw,56px) 20px clamp(28px,6vw,56px);
  -webkit-font-smoothing:antialiased;
}

/* ---------- cordino ---------- */
.cord{
  display:block;
  width:120px;
  height:clamp(22px,5vw,46px);
  margin-bottom:-10px;
  position:relative;
  z-index:3;
}
.cord path{
  fill:none;
  stroke:var(--cord);
  stroke-width:2.5;
  stroke-linecap:round;
}

/* ---------- cartellino ---------- */
.tag{
  position:relative;
  width:min(430px,100%);
  background:var(--paper);
  padding:clamp(46px,9vw,60px) clamp(26px,7vw,40px) clamp(28px,6vw,36px);
  border-radius:3px;
  box-shadow:
    0 1px 0 var(--paper-edge),
    0 24px 50px -18px rgba(0,0,0,.7),
    0 2px 6px rgba(0,0,0,.35);
  transform-origin:50% -6px;
  overflow:hidden;
}

/* grana della carta */
.tag::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.32;
  mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23g)' opacity='.5'/></svg>");
}

/* foro con occhiello */
.hole{
  position:absolute;
  top:clamp(15px,3.6vw,21px);
  left:50%;
  transform:translateX(-50%);
  width:19px;
  height:19px;
  border-radius:50%;
  background:var(--stock);
  box-shadow:
    0 0 0 4px var(--paper),
    0 0 0 5.5px var(--rule),
    inset 0 1px 2px rgba(0,0,0,.6);
  z-index:2;
}

/* ---------- intestazione ---------- */
.eyebrow{
  font-size:10px;
  letter-spacing:.19em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 0 18px;
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.name{
  font-family:"Fraunces",Georgia,serif;
  font-variation-settings:"opsz" 120,"SOFT" 40,"WONK" 1;
  font-weight:500;
  font-size:clamp(38px,10.5vw,52px);
  line-height:.94;
  letter-spacing:-.018em;
  margin:0 0 14px;
  position:relative;
  z-index:1;
}

.role{
  font-size:12.5px;
  line-height:1.55;
  letter-spacing:.02em;
  color:var(--ink-soft);
  margin:0 0 26px;
  max-width:30ch;
}

/* ---------- timbro ---------- */
.stamp{
  position:absolute;
  top:clamp(88px,20vw,104px);
  right:clamp(-6px,-1vw,0px);
  width:clamp(96px,25vw,116px);
  transform:rotate(-13deg);
  color:var(--stamp);
  opacity:.62;
  mix-blend-mode:multiply;
  pointer-events:none;
  z-index:0;
}
.stamp svg{width:100%;height:auto;display:block}

/* ---------- campi scheda ---------- */
.spec{
  margin:0 0 26px;
  border-top:1px solid var(--rule);
  position:relative;
  z-index:1;
}
.spec .row{
  display:flex;
  gap:14px;
  align-items:baseline;
  padding:9px 0;
  border-bottom:1px solid var(--rule);
}
.spec dt{
  flex:0 0 88px;
  font-size:9.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.spec dd{
  margin:0;
  font-size:13px;
  letter-spacing:.01em;
}

/* ---------- contatti ---------- */
.links{
  display:flex;
  flex-direction:column;
  gap:2px;
  margin-bottom:26px;
  position:relative;
  z-index:1;
}
.links a{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:14px;
  padding:11px 10px 11px 12px;
  margin:0 -10px 0 -12px;
  color:var(--ink);
  text-decoration:none;
  font-size:13px;
  letter-spacing:.01em;
  border-radius:2px;
  transition:background .16s ease;
}
.links a:hover,
.links a:focus-visible{background:rgba(86,61,130,.09)}
.links a:focus-visible{outline:2px solid var(--stamp);outline-offset:1px}
.links .k{
  font-size:9.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-soft);
  flex:0 0 88px;
}
.links .v{
  flex:1 1 auto;
  overflow-wrap:anywhere;
}

/* ---------- salva contatto ---------- */
.save{
  width:100%;
  font-family:inherit;
  font-size:11px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--paper);
  background:var(--ink);
  border:none;
  border-radius:2px;
  padding:15px 18px;
  cursor:pointer;
  transition:background .16s ease;
  position:relative;
  z-index:1;
}
.save:hover{background:var(--stamp)}
.save:focus-visible{outline:2px solid var(--stamp);outline-offset:3px}

.foot{
  margin-top:22px;
  font-size:9.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#5c554b;
}

/* ---------- ingresso: il cartellino si assesta ---------- */
@media (prefers-reduced-motion:no-preference){
  .tag{animation:settle 1.5s cubic-bezier(.22,.68,.31,1.01) both}
  .cord{animation:settle 1.5s cubic-bezier(.22,.68,.31,1.01) both}
  @keyframes settle{
    0%   {transform:rotate(-7deg) translateY(-14px);opacity:0}
    35%  {opacity:1}
    55%  {transform:rotate(3.2deg)}
    78%  {transform:rotate(-1.4deg)}
    100% {transform:rotate(0deg) translateY(0);opacity:1}
  }
}
</style>
</head>
<body>

<svg class="cord" viewBox="0 0 120 46" aria-hidden="true">
  <path d="M60 46 C 60 26, 34 24, 34 6 M60 46 C 60 26, 86 24, 86 6"/>
</svg>

<main class="tag">
  <span class="hole" aria-hidden="true"></span>

  <p class="eyebrow"><span>Scheda contatto</span><span>Milano</span></p>

  <h1 class="name">Lavinia<br>Cognome</h1>

  <p class="role">Sviluppo prodotto calzature — dal disegno alla scarpa finita.</p>

  <div class="stamp" aria-hidden="true">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="55" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <text x="60" y="55" text-anchor="middle" font-family="IBM Plex Mono, monospace"
            font-size="15" font-weight="600" letter-spacing="1.5" fill="currentColor">MILANO</text>
      <text x="60" y="74" text-anchor="middle" font-family="IBM Plex Mono, monospace"
            font-size="10" letter-spacing="1" fill="currentColor">CALZATURE</text>
    </svg>
  </div>

  <dl class="spec">
    <div class="row"><dt>Base</dt><dd>Milano, Italia</dd></div>
    <div class="row"><dt>Esperienza</dt><dd>20+ anni · moda e lusso</dd></div>
    <div class="row"><dt>Lingue</dt><dd>Italiano · Inglese</dd></div>
  </dl>

  <nav class="links">
    <a id="l-mail" href="mailto:tua@email.it">
      <span class="k">Email</span><span class="v">tua@email.it</span>
    </a>
    <a id="l-in" href="https://linkedin.com/in/tuo-profilo" target="_blank" rel="noopener">
      <span class="k">LinkedIn</span><span class="v">/in/tuo-profilo</span>
    </a>
    <a id="l-site" href="https://tuo-sito.it" target="_blank" rel="noopener">
      <span class="k">Portfolio</span><span class="v">tuo-sito.it</span>
    </a>
  </nav>

  <button class="save" id="save" type="button">Salva contatto</button>

  <p class="foot" style="text-align:center;margin-bottom:0">Aggiungi alla rubrica · .vcf</p>
</main>

<script>
/* ─────────────────────────────────────────────────────────────
   MODIFICA SOLO QUESTO BLOCCO.
   I valori qui sotto aggiornano sia la pagina sia la vCard.
   ───────────────────────────────────────────────────────────── */
const CONTATTO = {
  nome:     "Lavinia",
  cognome:  "Daretti",
  ruolo:    "Sviluppo prodotto calzature",
  azienda:  "",                              // lascia vuoto se non serve
  email:    "lavinia.daretti@gmail.com",
  telefono: "+39 345 5308649",                              // es. "+39 345 5308649" — vuoto = riga assente
  sito:     "",
  linkedin: "https://www.linkedin.com/in/lavinia-daretti-aa340b4/",
  citta:    "Milano",
  paese:    "Italia"
};

/* ── da qui in giù non serve toccare nulla ── */

const pulisci = u => u.replace(/^https?:\/\//,"").replace(/\/$/,"");

// sincronizza la pagina con i dati
document.querySelector(".name").innerHTML =
  `${CONTATTO.nome}<br>${CONTATTO.cognome}`;
document.title = `${CONTATTO.nome} ${CONTATTO.cognome} — Scheda contatto`;

const applica = (id, href, testo) => {
  const el = document.getElementById(id);
  if (!el) return;
  if (!href) { el.remove(); return; }
  el.href = href;
  el.querySelector(".v").textContent = testo;
};

applica("l-mail", CONTATTO.email ? "mailto:" + CONTATTO.email : "", CONTATTO.email);
applica("l-in",   CONTATTO.linkedin, "/" + pulisci(CONTATTO.linkedin).split("/").slice(1).join("/"));
applica("l-site", CONTATTO.sito, pulisci(CONTATTO.sito));

// riga telefono, aggiunta solo se compilata
if (CONTATTO.telefono) {
  const a = document.createElement("a");
  a.href = "tel:" + CONTATTO.telefono.replace(/\s/g,"");
  a.innerHTML = `<span class="k">Telefono</span><span class="v">${CONTATTO.telefono}</span>`;
  document.querySelector(".links").appendChild(a);
}

// generazione vCard lato browser
document.getElementById("save").addEventListener("click", () => {
  const c = CONTATTO;
  const righe = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${c.cognome};${c.nome};;;`,
    `FN:${c.nome} ${c.cognome}`,
    c.azienda  ? `ORG:${c.azienda}` : "",
    c.ruolo    ? `TITLE:${c.ruolo}` : "",
    c.email    ? `EMAIL;TYPE=INTERNET,WORK:${c.email}` : "",
    c.telefono ? `TEL;TYPE=CELL:${c.telefono}` : "",
    c.sito     ? `URL:${c.sito}` : "",
    c.linkedin ? `X-SOCIALPROFILE;TYPE=linkedin:${c.linkedin}` : "",
    `ADR;TYPE=WORK:;;;${c.citta};;;${c.paese}`,
    "END:VCARD"
  ].filter(Boolean).join("\r\n");

  const blob = new Blob([righe], { type:"text/vcard;charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = `${c.nome}-${c.cognome}.vcf`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
});
</script>
</body>
</html>
